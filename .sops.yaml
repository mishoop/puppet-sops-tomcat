# SOPS configuration file
# Update the 'age' field with your actual public key after generating it

creation_rules:
  # Encrypt all secret files with age
  - path_regex: hieradata/secrets/.*\.yaml$
    age: >-
      age177f2346qq7z8e5cwr9qve2z0fh0dhw4z2w7pevrq0xt88enfvqlqe8jate 
    # Replace the above with your actual age public key from:
    # /etc/puppetlabs/puppet/sops/age-public-key.txt on puppet-master

  # You can add multiple recipients for shared access
  # - path_regex: environments/.*/hieradata/secrets/.*\.yaml$
  #   age: >-
  #     age1key1...,
  #     age1key2...
